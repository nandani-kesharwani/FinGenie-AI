<!DOCTYPE html>
<html>
<head>
    <title>FinGenie AI Advisor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h1 class="text-center">
    🤖 AI Financial Advisor
</h1>

<hr>

<div class="card shadow p-4">

    <h4>Welcome!</h4>

    <p>
        Ask me anything about budgeting, saving money,
        expenses, investments, or personal finance.
    </p>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Ask your question
            </label>

           <input
    type="text"
    name="question"
    class="form-control"
    placeholder="Ask me anything about finance..."
    value="{{ request.form.question if request.form.question else '' }}"
    required
>

        </div>

        <button class="btn btn-primary">
            Ask AI
        </button>
{% if answer %}

<div class="alert alert-success mt-4">

    <h5> Solution:</h5>

    <p>{{ answer }}</p>

</div>

{% endif %}
    </form>

</div>

<br>

<a href="/dashboard" class="btn btn-dark">
    ⬅ Back to Dashboard
</a>

</body>
</html>
